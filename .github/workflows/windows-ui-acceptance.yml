name: Windows UI acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ui-acceptance.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-ui-acceptance.yml"

permissions:
  contents: read

jobs:
  ui-acceptance:
    name: Real desktop smoke test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish application and UI test driver
        shell: pwsh
        run: |
          dotnet publish windows/JustChat.Windows/JustChat.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/ui/app -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows/JustChat.UiSmokeTests/JustChat.UiSmokeTests.csproj --configuration Release --output artifacts/ui/runner --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise translation, hotkeys, write-back and preferences
        shell: pwsh
        run: |
          dotnet artifacts/ui/runner/JustChat.UiSmokeTests.dll "$PWD/artifacts/ui/app/JustChat.exe" "$PWD/artifacts/ui/results" 2>&1 | Tee-Object -FilePath artifacts/ui/acceptance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload acceptance logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: justchat-ui-acceptance
          path: |
            artifacts/ui/results/
            artifacts/ui/acceptance.log
          if-no-files-found: warn
          retention-days: 7
